services:
  web:
    build: .
    restart: unless-stopped
    # Cloudflare Tunnel (cloudflared, running on the host) proxies to this port.
    # See deploy/README.md — there is no reverse proxy in front of it.
    ports:
      - "4917:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
